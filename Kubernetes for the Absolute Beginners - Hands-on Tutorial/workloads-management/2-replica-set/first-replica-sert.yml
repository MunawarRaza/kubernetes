---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend-replica-set
  labels:
    env: qa
spec:
  replicas: 3
  selector:
    matchLabels:
      type: frontend
  template:
    metadata:
      name: frontend-pod
      labels:
        env: qa1
        type: frontend
    spec:
      containers:
      - name: frontend-container
        image: nginx